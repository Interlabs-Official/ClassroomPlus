# mappings.yml #

# List of mappings to be used in themes. They may be used as you would usually use a pseudo-class in CSS.
# For example, instead of using .a1b2c3 {}, you can use :courseCard {}.

# The course cards on the main homepage of Google Classroom
courseCard:
  any:
    - 'ol > li[data-draggable-item-id]'

# The general background of Google Classroom
background:
  any:
    - 'body, div[jscontroller] > ol'

# The background of a class's main stream
backgroundStream:
  any:
    - 'c-wiz[data-include-user-lists] > div[jsname]'

# The sidebar on the left of Google Classroom
sidebar:
  any:
    - 'div[jscontroller] > div[data-impressions-entry-point]'

# For items within a group, e.g. Enrolled
sidebarGroupItem:
  any:
    - 'div[role="group"] > a[aria-label]'

sidebarItem:
  any:
    - 'div[data-impressions-entry-point] > a[aria-label]'

sidebarItemText:
  any:
    - 'a[aria-current] > div > div'

topbar:
  any:
    - 'nav[jscontroller][jsaction]'

genericIcon:
  any:
    - 'svg, svg[class][focusable][viewBox], button[jscontroller][aria-haspopup="menu"]'

streamNavbar:
  any:
    - 'nav > div[jscontroller][jsaction] > div'

streamNavbarText:
  any:
    - 'div[data-impressions-entry-point] > div[role="listitem"] > a[href]'

streamElement:
  any:
    - 'div[data-include-stream-item-materials][data-stream-item-id]'

complementaryStreamElement:
  any:
    - 'aside[role="complementary"] div:has(> div[jscontroller][jsaction])'

newAnnouncementButton:
  any:
    - 'div[data-is-touch-wrapper] > button[data-idom-class]'

newAnnouncementButton_text:
  any:
    - 'div[data-is-touch-wrapper] > button[data-idom-class] > span[jsname]'

#
# Selectors
# Selectors are essentially helpers, for example 'selector/everythingExceptSymbols'
# selects everything that isn't Google-defined symbols. Useful for fonts.
#

selector/everythingExceptSymbols:
  any:
    - '*:not(.google-symbols)'