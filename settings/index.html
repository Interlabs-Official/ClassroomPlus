<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap');
        * {
            font-family: 'Golos Text', sans-serif;
        }
        /*body {
            background: radial-gradient(100% 100% at 32% 72%, #000000 0%, transparent),radial-gradient(100% 100% at 80% 20%, #003180 0%, transparent),#1b253b;
        }*/
        #card-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            /*padding: 10px;*/
        }
        .card {
            width: 300px;
            overflow: hidden;
            background-color: #0f0f0f;
            color: #ffffff;
            border-radius: 8px;
            box-shadow: 5px 5px #000000;
            margin: 16px;
        }
        .card-image {
            width: 100%;
            height: auto;
        }
        .card-content {
            padding-top: 16px;
            padding-left: 16px;
            padding-right: 16px;
            padding-bottom: 12px;
        }
        .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .title-row h3 { margin: 0; text-shadow: 2px 3px #000000; }
        .card-apply {
            border-radius: 2px;
            padding: 4px;
            padding-left: 8px;
            padding-right: 8px;
            border: none;
            color: #ffffff;
            background-color: #0091ff;
            box-shadow: 2px 3px #000000;
            cursor: pointer;
        }
        .card-apply:hover {
            background-color: #28a2ff;
        }
        #repository-list {
            margin: 10px;
        }
        .repository-list-item {
            width: 97.5%;
            background-color: #0f0f0f;
            box-shadow: 2px 3px #000000;
            text-shadow: 2px 3px #000000;
            border-radius: 4px;
            padding: 12px;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .repo-authors {
            color: rgb(174, 174, 174);
        }

        /* Credit: Google Gemini */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        #content div {
            animation-name: fadeInUp;
            animation-duration: 0.2s;
            animation-timing-function: ease-out;
            animation-fill-mode: forwards;
        }
    </style>
</head>
<body>
    <h1>Welcome to Settings.</h1>
    <div id="toggles"></div>
    <div id="sidebar">
        <button tab="themes">Themes</button>
        <button tab="repositories">Repositories</button>
    </div>
    <div id="content">
        <div id="themes">
            <div id="card-container">
                <!--
                <div class="card">
                    <img src="space.jpg" class="card-image"></img>
                    <div class="card-content">
                        <div class="title-row">
                            <h3>Space Theme</h3>
                            <button id="apply-button">Apply</button>
                        </div>
                        <p>The classic Space Theme, built for Google Classroom!</p>
                    </div>
                </div>
                -->

            </div>
        </div>
        <div id="repositories">
            <!--<p>No repositories to show.</p>-->
            <div id="repository-list">
                <div class="repository-list-item">
                    <span class="repo-name">Classroom+ Official Repository</span>
                    <span class="repo-authors">by solarcosmic, Convy32</span>
                </div>
            </div>
            <button id="manage-repo">+ Add Repository</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
