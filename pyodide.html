<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyodide MV3 Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        #output {
            background: #f4f4f4;
            border: 1px solid #ddd;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
            min-height: 100px;
            white-space: pre-wrap;
            font-family: monospace;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        #status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .loading {
            background: #fff3cd;
            border: 1px solid #ffc107;
        }
        .ready {
            background: #d4edda;
            border: 1px solid #28a745;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #dc3545;
        }
    </style>
</head>
<body>
    <h1>Pyodide MV3 Local Test</h1>
    
    <div id="status" class="loading">Loading Pyodide...</div>
    
    <div>
        <button id="testBasic" disabled>Test Basic Python</button>
        <button id="testNumpy" disabled>Test NumPy</button>
        <button id="testPandas" disabled>Test Pandas</button>
        <button id="clearOutput">Clear Output</button>
    </div>
    
    <h2>Output:</h2>
    <div id="output"></div>

    <!-- Load Pyodide from local files -->
    <script src="pyodide/pyodide.js"></script>
    <script src="pyodideld.js"></script>
</body>
</html>
